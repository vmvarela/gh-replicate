name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: true
      - run: gofmt -d *.go
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: go test -race -timeout 3m ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: python3 scripts/test_verify_e2e.py -v


  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Keep this in step with cli/gh-extension-precompile: a missing platform
        # here only shows up as a failed release after publication.
        goos: [linux, darwin, windows, freebsd, netbsd, openbsd, solaris, plan9]
        goarch: [amd64]
        include:
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Cross-compile extension
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -o gh-replicate .

  cache-platforms:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Test cache and OS locking
        run: go test -timeout 3m -run 'Test(CacheLock.*|Journal.*|SyncGitCacheLifecycle|SyncGitNewObjectsAndSecondTarget|LFS.*)$' ./...
