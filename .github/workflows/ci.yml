name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
