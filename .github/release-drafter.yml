name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

version-resolver:
  minor:
    labels: [enhancement]
  patch:
    labels: [bug, documentation]
  default: patch

categories:
  - title: Added
    labels: [enhancement]
  - title: Fixed
    labels: [bug]
  - title: Documentation
    labels: [documentation]
  - title: Other Changes
    labels: ['*']

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
template: |
  $CHANGES
